basePath: /api/v1
definitions:
  dto.AcceptInviteRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  dto.AgingBreakdown:
    properties:
      0_to_3_days:
        type: integer
      3_to_7_days:
        type: integer
      7_plus_days:
        type: integer
    type: object
  dto.ApprovalResponse:
    properties:
      approver_id:
        type: string
      created_at:
        type: string
      decision:
        type: string
      decision_note:
        type: string
      failure_at:
        type: string
      failure_reason:
        type: string
      id:
        type: string
      org_id:
        type: string
      payment_at:
        type: string
      payment_method:
        type: string
      payment_status:
        type: string
      request_id:
        type: string
      request_status:
        type: string
      updated_at:
        type: string
    type: object
  dto.ApproveRequest:
    properties:
      note:
        type: string
    type: object
  dto.AuditLogItem:
    properties:
      action:
        type: string
      actor_id:
        type: string
      actor_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      org_id:
        type: string
      target_id:
        type: string
    type: object
  dto.AuditLogListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.AuditLogItem'
        type: array
      pagination:
        $ref: '#/definitions/dto.AuditPagination'
    type: object
  dto.AuditPagination:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.CreateOrgRequest:
    properties:
      currency:
        type: string
      name:
        type: string
    required:
    - currency
    - name
    type: object
  dto.DashboardSummaryResponse:
    properties:
      aging_breakdown:
        $ref: '#/definitions/dto.AgingBreakdown'
      critical_count:
        type: integer
      escalated_items:
        items:
          $ref: '#/definitions/dto.EscalatedItem'
        type: array
      pending_count:
        type: integer
      urgency_breakdown:
        $ref: '#/definitions/dto.UrgencyBreakdown'
      urgent_count:
        type: integer
    type: object
  dto.DeleteAccountRequest:
    properties:
      current_password:
        type: string
    required:
    - current_password
    type: object
  dto.EscalatedItem:
    properties:
      amount:
        type: number
      created_at:
        type: string
      days_pending:
        type: integer
      id:
        type: string
      requester_id:
        type: string
      requester_name:
        type: string
      urgency:
        type: string
    type: object
  dto.FinancialStats:
    properties:
      currency:
        type: string
      this_month_spent:
        type: number
      total_spent:
        type: number
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.InviteRequest:
    properties:
      email:
        type: string
      role:
        type: string
    required:
    - email
    - role
    type: object
  dto.InviteResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      org_id:
        type: string
      role:
        type: string
      token:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      orgs:
        items:
          $ref: '#/definitions/dto.OrgMembershipDTO'
        type: array
      refresh_token:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponseDTO'
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.MarkPaidRequest:
    properties:
      payment_method:
        type: string
    type: object
  dto.MemberCounts:
    properties:
      finance:
        type: integer
      org_admin:
        type: integer
      staff:
        type: integer
      total:
        type: integer
    type: object
  dto.MemberResponse:
    properties:
      email:
        type: string
      joined_at:
        type: string
      name:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  dto.OrgMembershipDTO:
    properties:
      department:
        type: string
      org_id:
        type: string
      org_name:
        type: string
      org_slug:
        type: string
      role:
        type: string
    type: object
  dto.OrgResponse:
    properties:
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      name:
        type: string
      plan:
        type: string
      slug:
        type: string
      updated_at:
        type: string
    type: object
  dto.OrgStatsResponse:
    properties:
      financials:
        $ref: '#/definitions/dto.FinancialStats'
      member_counts:
        $ref: '#/definitions/dto.MemberCounts'
      org_id:
        type: string
      plan_usage:
        $ref: '#/definitions/dto.PlanUsageStats'
      request_stats:
        $ref: '#/definitions/dto.RequestStats'
    type: object
  dto.PaymentFailedRequest:
    properties:
      failure_reason:
        type: string
    type: object
  dto.Plan:
    properties:
      features:
        items:
          type: string
        type: array
      id:
        type: string
      name:
        type: string
      price:
        type: number
      request_limit:
        description: 0 represents unlimited
        type: integer
      user_limit:
        description: 0 represents unlimited
        type: integer
    type: object
  dto.PlanUsageStats:
    properties:
      current_plan:
        type: string
      request_limit:
        description: 0 = unlimited
        type: integer
      requests_this_month:
        type: integer
      user_count:
        type: integer
      user_limit:
        description: 0 = unlimited
        type: integer
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RejectRequest:
    properties:
      reason:
        type: string
    type: object
  dto.RequestStats:
    properties:
      approved:
        type: integer
      failed:
        type: integer
      paid:
        type: integer
      pending:
        type: integer
      rejected:
        type: integer
      total:
        type: integer
      withdrawn:
        type: integer
    type: object
  dto.ResendCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      otp:
        type: string
    required:
    - email
    - new_password
    - otp
    type: object
  dto.SignupRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UpdateOrgRequest:
    properties:
      currency:
        type: string
      name:
        type: string
    type: object
  dto.UpdatePlanRequest:
    properties:
      plan:
        type: string
    required:
    - plan
    type: object
  dto.UpdatePlanResponse:
    properties:
      org_id:
        type: string
      plan:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  dto.UrgencyBreakdown:
    properties:
      critical:
        type: integer
      routine:
        type: integer
      urgent:
        type: integer
    type: object
  dto.UserResponseDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  dto.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
      verification_code:
        type: string
    required:
    - email
    type: object
  dto.VerifyEmailResponse:
    properties:
      message:
        type: string
      orgs:
        items:
          $ref: '#/definitions/dto.OrgMembershipDTO'
        type: array
      refresh_token:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponseDTO'
    type: object
info:
  contact: {}
  description: Settle backend REST API.
  title: Settle API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset OTP to the user's email address if registered.
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access and refresh tokens.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the user's tokens. Optionally invalidates the refresh token
        if provided.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /auth/me:
    delete:
      consumes:
      - application/json
      description: Soft deletes the authenticated user's account and revokes active
        tokens.
      parameters:
      - description: Current password confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Uses a valid refresh token to issue a new access token and a rotated
        refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Sends a new verification code to the given email. Always returns
        200 to prevent enumeration.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend verification code
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Verifies password reset OTP and sets a new password.
      parameters:
      - description: Reset password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password with OTP
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account and sends a verification code to the
        email.
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies a user's email with a 6-digit code. On success, returns
        auth tokens (user is signed in).
      parameters:
      - description: Email and code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VerifyEmailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify email address
      tags:
      - auth
  /v1/billing/plans:
    get:
      description: Returns all available subscription plans with pricing, feature
        sets, and request/user limits. Public endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/dto.Plan'
              type: array
            type: object
      summary: Get available subscription plans
      tags:
      - billing
  /v1/dashboard/summary:
    get:
      description: 'Returns high-level organization overview: pending requests count,
        urgency breakdown, aging breakdown, and escalated items. Accessible by org_admin
        and finance roles.'
      parameters:
      - description: Organization ID (optional if present in JWT token)
        in: query
        name: org_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/dto.DashboardSummaryResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get dashboard summary overview
      tags:
      - dashboard
  /v1/invitations/{token}/accept:
    post:
      consumes:
      - application/json
      description: Public endpoint. Validates token existence and expiry. Either registers
        a new user or links an existing account, then inserts them into org_members
        with the pre-assigned role within a single transaction.
      parameters:
      - description: Invitation Token
        in: path
        name: token
        required: true
        type: string
      - description: Accept invitation payload
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.AcceptInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              $ref: '#/definitions/dto.MemberResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Accept organization invitation
      tags:
      - invitations
  /v1/organizations:
    post:
      consumes:
      - application/json
      description: Creates a new organization row with an auto-generated slug, inserts
        the creator into org_members with role org_admin, and writes an audit log
        in a single transaction.
      parameters:
      - description: Organization creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateOrgRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              $ref: '#/definitions/dto.OrgResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an organization
      tags:
      - organizations
  /v1/organizations/{id}:
    get:
      description: Returns organization profile. Scoped to members of that organization
        only.
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/dto.OrgResponse'
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get organization profile
      tags:
      - organizations
    put:
      consumes:
      - application/json
      description: Updates organization name and/or currency. Allowed for org_admin
        only. Currency must be USD, EUR, or GBP.
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: string
      - description: Organization update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateOrgRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/dto.OrgResponse'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update organization
      tags:
      - organizations
  /v1/organizations/{id}/audit-log:
    get:
      description: Queries and paginates immutable audit logs for an organization.
        Accessible by org_admin and finance roles.
      parameters:
      - description: Organization ID
        in: path
        name: id
        required: true
        type: string
      - description: Filter by action type
        in: query
        name: action
        type: string
      - description: Filter by actor user ID
        in: query
        name: actor_id
        type: string
      - description: Filter by start timestamp (RFC3339)
        in: query
        name: start_date
        type: string
      - description: Filter by end timestamp (RFC3339)
        in: query
        name: end_date
        type: string
      - description: Page number (defaults to 1)
        in: query
        name: page
        type: integer
      - description: Items per page (defaults to 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuditLogListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
