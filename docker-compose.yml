# Settle — local infrastructure

services:
  postgres:
    image: postgres:15-alpine
    container_name: settle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: settle
      POSTGRES_PASSWORD: settle
      POSTGRES_DB: settle
    ports:
      - "5432:5432"
    volumes:
      - settle_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settle -d settle"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: settle-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - settle_minio_data:/data

  # Creates the receipts bucket once MinIO is up (idempotent)
  minio-init:
    image: minio/mc:latest
    container_name: settle-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/settle-receipts;
      exit 0;
      "

volumes:
  settle_pg_data:
  settle_minio_data:
