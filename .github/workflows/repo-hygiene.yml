name: Repo hygiene

# Language-agnostic checks only. Add build/test workflows after the stack is chosen.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
        env:
          # commit-msg / pre-push stages are local-only; skip them in CI file scan
          SKIP: conventional-commit-message,block-push-to-protected-branches

  pr-conventions:
    name: PR conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Conventional Commits PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must not start with an uppercase letter.
            Example: "feat: add settlement export"

      - name: Require feature-branch naming
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${HEAD_REF}" == "main" || "${HEAD_REF}" == "master" ]]; then
            echo "::error::Open pull requests from a feature branch, not from '${HEAD_REF}'."
            exit 1
          fi

          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|hotfix|release)/[a-z0-9._-]+$'
          if [[ ! "${HEAD_REF}" =~ ${pattern} ]]; then
            echo "::error::Branch '${HEAD_REF}' must match <type>/<short-description> (e.g. feat/invoice-export)."
            exit 1
          fi

      - name: Disallow WIP titles on non-draft PRs
        if: github.event.pull_request.draft == false
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          shopt -s nocasematch
          if [[ "${TITLE}" =~ (^|[^[:alnum:]])(wip|dnm|do[[:space:]]+not[[:space:]]+merge)([^[:alnum:]]|$) ]] \
            || [[ "${TITLE}" =~ ^\[wip\] ]]; then
            echo "::error::PR title looks like work-in-progress. Mark the PR as draft or rename the title."
            exit 1
          fi

  commit-messages:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Conventional Commits on every PR commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r sha; do
            subject="$(git log -1 --format=%s "${sha}")"
            tmp="$(mktemp)"
            printf '%s\n' "${subject}" > "${tmp}"
            if ! python scripts/git-hooks/commit_msg.py "${tmp}"; then
              echo "::error::Bad commit ${sha}: ${subject}"
              failed=1
            fi
            rm -f "${tmp}"
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")

          if [[ "${failed}" -ne 0 ]]; then
            echo "::error::One or more commits are not Conventional Commits. Amend/rebase locally (local hooks catch this earlier)."
            exit 1
          fi
          echo "OK: all commits follow Conventional Commits."
